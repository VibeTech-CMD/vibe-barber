<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0D10" />
  <meta name="description" content="Vibe Barber — Agendamento dinâmico de barbearia com sinal via Pix, repasse de horário e troca entre clientes." />
  <meta property="og:title" content="Vibe Barber — Agendamento de Barbearia" />
  <meta property="og:description" content="Reserve seu corte em segundos com sinal via Pix, repasse de vagas e troca de horários entre clientes." />
  <meta property="og:type" content="website" />
  <title>Vibe Barber — Agendamento de Barbearia</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <!-- Top Header -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="./assets/icon.svg" alt="Logo Vibe Barber" class="brand-icon" />
        <div class="brand-text">
          <span class="brand-name" id="headerShopName">Vibe Barber</span>
          <span class="brand-sub" id="headerDepositSubtitle">Sinal Pix R$ 10 • Sem filas</span>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="mode-switch" role="tablist" aria-label="Alternar modo de visualização">
          <button type="button" class="mode-btn active" data-mode="client" role="tab" aria-selected="true">Cliente</button>
          <button type="button" class="mode-btn" data-mode="barber" role="tab" aria-selected="false">Barbeiro</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Active Client Switcher (Client Mode Only — facilita testar trocas e repasses entre clientes) -->
  <div class="identity-bar" id="identityBar">
    <div class="identity-inner">
      <div class="identity-left">
        <span>Logado como:</span>
        <select id="clientSwitcher" class="identity-select" aria-label="Selecionar cliente ativo"></select>
        <button type="button" class="btn btn-outline btn-sm" id="btnNewClient">+ Novo perfil</button>
      </div>
      <span class="identity-hint">Troque de perfil para testar propostas de troca e repasse entre clientes</span>
    </div>
  </div>

  <!-- Main Content -->
  <main class="app-main">
    <!-- Desktop Client Tabs -->
    <nav class="desktop-tabs" id="desktopClientTabs" aria-label="Navegação do cliente">
      <button type="button" class="desktop-tab active" data-tab="book">
        <span>Agendar Horário</span>
      </button>
      <button type="button" class="desktop-tab" data-tab="bookings">
        <span>Meus Horários</span>
        <span class="tab-badge hidden" id="desktopBadgeBookings">0</span>
      </button>
      <button type="button" class="desktop-tab" data-tab="community">
        <span>Trocas &amp; Fila</span>
        <span class="tab-badge hidden" id="desktopBadgeCommunity">0</span>
      </button>
    </nav>

    <!-- Dynamic View Container -->
    <div id="viewRoot"></div>
  </main>

  <!-- Sticky Booking Checkout Bar (Client Book Tab) -->
  <div class="sticky-checkout hidden" id="stickyCheckout">
    <div class="sticky-checkout-inner">
      <div>
        <div class="checkout-summary-title" id="stickyTitle">Corte + Barba • 14:00</div>
        <div class="checkout-summary-sub" id="stickySub">Sinal Pix: R$ 10,00 • Restante na cadeira: R$ 55,00</div>
      </div>
      <button type="button" class="btn btn-primary" id="btnStartPixCheckout">
        Reservar com Sinal Pix
      </button>
    </div>
  </div>

  <!-- Mobile Bottom Navigation (Client Mode Only) -->
  <nav class="bottom-nav" id="mobileClientNav" aria-label="Navegação inferior">
    <button type="button" class="nav-item active" data-tab="book">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="3"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>Agendar</span>
    </button>
    <button type="button" class="nav-item" data-tab="bookings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      <span>Meus Horários</span>
      <span class="nav-badge hidden" id="mobileBadgeBookings">0</span>
    </button>
    <button type="button" class="nav-item" data-tab="community">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 1 21 5 17 9"/>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
        <polyline points="7 23 3 19 7 15"/>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
      </svg>
      <span>Trocas &amp; Fila</span>
      <span class="nav-badge hidden" id="mobileBadgeCommunity">0</span>
    </button>
  </nav>

  <!-- Modal Container -->
  <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script defer src="./scripts/store.js"></script>
  <script defer src="./scripts/pix.js"></script>
  <script defer src="./scripts/scheduler.js"></script>
  <script defer src="./scripts/app.js"></script>
</body>
</html>
